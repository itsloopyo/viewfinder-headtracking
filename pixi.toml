[workspace]
name = "viewfinder-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Viewfinder using the CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
restore = "dotnet restore src/ViewfinderHeadTracking/ViewfinderHeadTracking.csproj"
# setup-libs copies the build references out of the NuGet cache restore fills,
# so it runs after restore rather than before it.
setup = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1", depends-on = ["restore"] }
build = { cmd = "dotnet build src/ViewfinderHeadTracking/ViewfinderHeadTracking.csproj -c Release -m:1", depends-on = ["setup"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
uninstall = "scripts/uninstall.cmd"
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build"] }

# The two content gates over a built package, run by the release script after
# packaging. validate-manifest reads the newest ZIP in release/ and checks every
# source a manifest entry names is really in it; validate-notices checks
# THIRD-PARTY-NOTICES.md reproduces the licence text of each component the
# vendored loader redistributes. No depends-on: callers have already packaged.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"

clean = "dotnet clean src/ViewfinderHeadTracking/ViewfinderHeadTracking.csproj"

# Characterization tests over the plugin's pure maths, compiled from source against
# a UnityEngine stub. Game-independent, like build.
test = "dotnet test tests/ViewfinderHeadTracking.Tests/ViewfinderHeadTracking.Tests.csproj"

# Bump the vendored mod-loader copy to the latest upstream build at least two weeks
# old. Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

# pixi run release <major|minor|patch|nightly|X.Y.Z>, unattended end to end.
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
release-nightly = "powershell -ExecutionPolicy Bypass -File scripts/release-nightly.ps1"
